# Coolify-ready compose for a private Gutendex mirror (gutendex-next).
# This file belongs at the ROOT of your fork of
# https://github.com/Pool-Of-Tears/gutendex-next (replacing the upstream
# docker-compose.yml), next to the upstream Dockerfile. Deploying it anywhere
# else fails the build with "failed to read dockerfile" because `context: .`
# resolves to wherever the compose file lives.
services:
  gutendex-next:
    container_name: gutendex-next
    build:
      context: .
      # Alternative for a Coolify "Docker Compose (empty)" resource pasted
      # without a repo checkout: point the context at the public fork URL
      # instead (the fork must still contain the entrypoint + auth patch).
      # context: https://github.com/<you>/gutendex-next.git#main
    restart: unless-stopped
    # ports (not expose): Coolify only auto-detects the container port from
    # `ports`; with expose it falls back to probing localhost:3000 and the
    # deploy gate fails. The Bearer gate is what protects the API, so a host
    # binding here is acceptable.
    ports:
      - "8000:8000"
    environment:
      # Bearer token every catalog request must carry; the app sends it from
      # the gutendex_api_key Remote Config key. Generate a long random value.
      GUTENDEX_API_TOKEN: ${GUTENDEX_API_TOKEN}
      UVICORN_WORKERS: "2"
      UVICORN_LIMIT_MAX_REQUESTS: "2000"
      # Set true only for the first boot (one-time ~10-15 min catalog
      # import); leave false afterwards so restarts stay instant.
      RUN_UPDATECATALOG_ON_STARTUP: ${RUN_UPDATECATALOG_ON_STARTUP:-false}
    volumes:
      - gutendex-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  gutendex-data:
